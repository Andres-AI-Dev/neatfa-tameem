services:
  ros2-argos-ppo:
    build: .
    image: ros2-argos-ppo:latest
    container_name: ros2_argos_ppo
    
    # Enable GUI applications (for ARGoS visualization)
    environment:
      - DISPLAY=host.docker.internal:0
      - QT_X11_NO_MITSHM=1
      
    # Network mode for ROS2 communication
    network_mode: host
    
    # Mount volumes for development
    volumes:
      # Mount our PPO implementation
      - ./ppo_implementation:/root/ppo_argos
      # Mount ARGoS experiments
      - ../argos/experiments:/root/argos_experiments
      # Mount for X11 socket (macOS specific with XQuartz)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      
    # Keep container running
    stdin_open: true
    tty: true
    
    # Run bash by default
    command: /bin/bash